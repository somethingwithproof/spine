# Existing SonarCloud project; credentials belong only in GitHub Secrets.
sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_spine
sonar.sources=src,scripts,.github/scripts
sonar.tests=tests,.github/scripts
sonar.test.inclusions=tests/**,.github/scripts/test-*.py
sonar.exclusions=src/third_party/**,.github/scripts/test-*.py
sonar.sourceEncoding=UTF-8
# Build and analysis run on the same runner so paths and generated headers match.
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.coverageReportPaths=coverage/sonar.xml
