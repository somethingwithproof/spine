# Existing SonarCloud project; credentials belong only in GitHub Secrets.
sonar.host.url=https://sonarcloud.io
sonar.organization=somethingwithproof
sonar.projectKey=somethingwithproof_spine
# Autotools keeps production sources at the top level. A single * does not
# cross directories, so tests/ and generated config/ stay out of sources.
sonar.sources=.
sonar.inclusions=*.c,*.h,src/core/**/*.c,src/core/**/*.h
sonar.exclusions=uthash.h,config/**,autom4te.cache/**,m4/**,coverage/**
sonar.tests=tests
sonar.test.inclusions=tests/**/*.c,tests/**/*.h,tests/**/*.sh
sonar.sourceEncoding=UTF-8
# Build and analysis run on the same runner so paths and generated headers match.
sonar.cfamily.compile-commands=compile_commands.json
sonar.coverageReportPaths=coverage/sonar.xml
