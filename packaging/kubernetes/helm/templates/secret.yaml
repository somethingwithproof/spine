{{- if not .Values.db.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cacti-spine.fullname" . }}
  labels:
    {{- include "cacti-spine.labels" . | nindent 4 }}
type: Opaque
data:
  # base64-encoded at render time; pass via --set db.password=<value> or a values file.
  db-password: {{ .Values.db.password | b64enc | quote }}
{{- end }}
