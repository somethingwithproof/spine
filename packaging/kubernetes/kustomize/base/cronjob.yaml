apiVersion: batch/v1
kind: CronJob
metadata:
  name: cacti-spine
  labels:
    app.kubernetes.io/name: cacti-spine
    app.kubernetes.io/component: poller
spec:
  # Override schedule in an overlay patch.
  schedule: "*/1 * * * *"
  # Forbid concurrent runs: spine is a one-shot poller and must not overlap itself.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cacti-spine
            app.kubernetes.io/component: poller
        spec:
          serviceAccountName: cacti-spine
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: spine
              # Override image tag in an overlay patch.
              image: ghcr.io/cacti/spine:1.3.0
              imagePullPolicy: IfNotPresent
              command:
                - /usr/sbin/spine
                - --conf
                - /etc/spine/spine.conf
                # Poller ID 0 is the default single-poller case.
                # For distributed polling, deploy one CronJob per poller ID
                # and override this argument in each overlay.
                - --poller
                - "0"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
                  # NET_RAW is required for ICMP ping checks.
                  # Remove this if the environment only uses SNMP (no ping),
                  # or if the cluster enforces PodSecurity Restricted profile.
                  add: ["NET_RAW"]
              env:
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: cacti-spine
                      key: db-password
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: spine-conf
                  mountPath: /etc/spine
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: spine-conf
              configMap:
                name: cacti-spine
            - name: tmp
              # tmpfs keeps the read-only root filesystem requirement satisfied
              # while still giving spine a writable scratch space.
              emptyDir:
                medium: Memory
