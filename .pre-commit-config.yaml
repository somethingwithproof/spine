repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
        types: [c, h]
      - id: trailing-whitespace
        types: [c, h]
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: ^config/  # generated autotools scripts (ltmain.sh etc.)

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
      - id: clang-format
        types: [c]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck static analysis
        entry: cppcheck
        args: ['--error-exitcode=1', '--enable=warning,portability', '--suppress=missingInclude', '--quiet']
        language: system
        types: [c]

      - id: shellharden
        name: Shell script safety check
        entry: shellharden
        args: ['--check']
        language: system
        types: [shell]
