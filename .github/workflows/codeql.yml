name: "CodeQL"

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "**/*.php"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.php"
      - "**/*.md"
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["c-cpp"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Install C build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool help2man libmariadb-dev libsnmp-dev libssl-dev
      - name: Build C sources for CodeQL
        run: |
          set -eu
          mkdir -p config m4
          autoreconf -fi
          ./configure CC=gcc
          make -j2 spine
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3
        with:
          category: "/language:${{ matrix.language }}"
