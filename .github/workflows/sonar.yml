name: Sonar

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_sonar:
        description: Run analysis (ENABLE_SONAR must also be true)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Sonar execution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Evaluate branch policy
        id: policy
        env:
          ENABLE_SONAR: ${{ vars.ENABLE_SONAR }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED }}
        run: python3 .github/scripts/sonar-policy.py

  analyze:
    name: Sonar analysis
    needs: policy
    # Independent trust boundary: a fork cannot enable this job by modifying
    # the policy script. Do not use pull_request_target for this workflow.
    if: >-
      needs.policy.outputs.eligible == 'true' &&
      vars.ENABLE_SONAR == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::error::Sonar was requested but SONAR_TOKEN is missing. See docs/ci.md.'
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-coverage.txt
      - name: Install build dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          packages: cmake ninja-build pkg-config gcc lcov libsnmp-dev default-libmysqlclient-dev libssl-dev libseccomp-dev libuv1-dev
      - name: Build, test and collect native coverage
        uses: ./.github/actions/collect-coverage
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Upload analysis coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage
          path: coverage/
          if-no-files-found: warn

  quality-gate:
    name: Sonar Quality Gate
    needs: [policy, analyze]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Report requested analysis outcome
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          ELIGIBLE: ${{ needs.policy.outputs.eligible }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED }}
        run: python3 .github/scripts/sonar-gate.py
