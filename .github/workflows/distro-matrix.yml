name: Distro matrix

# Build spine and run "make check" on the distributions it is packaged for,
# so header, libc and client-library differences show up on the pull
# request instead of in a downstream package build. See docs/platforms.md.
#
# Support policy: a release is tested until its vendor end-of-life date,
# new releases are added after general availability, and a lane is removed
# when its release reaches end of life. distro-eol.yml checks the lanes
# below against endoflife.date every week. Keep the lists here, in
# scripts/test-distros.sh and in .github/scripts/check-distro-eol.py in step.

on:
  pull_request:
    branches: [develop]
    paths: &build_paths
      - "configure.ac"
      - "Makefile.am"
      - "**.c"
      - "**.h"
      - "tests/**"
      - "scripts/test-distros.sh"
      - ".github/scripts/check-distro-eol.py"
      - ".github/workflows/distro-matrix.yml"
  push:
    branches: [develop]
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distro-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Alpine fails for two reasons outside this workflow (follow-up issue to
    # be filed; replace this line with its URL): worker threads run
    # poll_host(), whose frame is about 145 KiB, on musl's 128 KiB default
    # thread stack, so test_spine_faults segfaults at poller.c poll_host();
    # and Makefile.am runs the bash-only tests/integration/test_alloc_failure.sh
    # with $(SHELL), which is busybox sh there. Drop this once both are fixed.
    continue-on-error: ${{ matrix.image == 'alpine:3.24' }}
    strategy:
      fail-fast: false
      matrix:
        # The Docker Hub "rockylinux" library image stopped updating in 2024;
        # the Rocky project publishes current images as rockylinux/rockylinux.
        image:
          - rockylinux/rockylinux:8
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:10
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
          - fedora:44
          - opensuse/leap:16.0
          - alpine:3.24
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/test-distros.sh "$IMAGE"

  # GitHub has no BSD runners and no first-party action that boots a BSD
  # guest. cross-platform-actions covers all three systems from one pinned
  # action on a KVM-capable Linux runner; the vmactions alternative is one
  # third-party action per system, three to pin and audit instead of one.
  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # FreeBSD builds one package set per major release against its
        # newest minor, so each lane uses the newest minor of its branch.
        include:
          - name: FreeBSD 14.5
            os: freebsd
            version: "14.5"
          - name: FreeBSD 15.1
            os: freebsd
            version: "15.1"
          - name: NetBSD 10.1
            os: netbsd
            version: "10.1"
          - name: NetBSD 11.0
            os: netbsd
            version: "11.0"
          - name: OpenBSD 7.9
            os: openbsd
            version: "7.9"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start ${{ matrix.name }} VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          sync_files: runner-to-vm

      - name: Install dependencies
        shell: cpa.sh {0} --sync-files none
        run: sudo sh scripts/test-distros.sh --deps

      - name: Build and test
        shell: cpa.sh {0} --sync-files none
        run: sh scripts/test-distros.sh --build .
