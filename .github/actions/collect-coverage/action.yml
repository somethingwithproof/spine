name: Collect native coverage
description: Build the real CMake targets, run CTest and retain native coverage.
runs:
  using: composite
  steps:
    - name: Install locked coverage tooling
      shell: bash
      run: python3 -m pip install --require-hashes -r .github/requirements-coverage.txt
    - name: Configure coverage and compilation database
      shell: bash
      run: |
        set -euo pipefail
        cmake --preset ci-main -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_C_FLAGS='-O0 -g3 --coverage' -DCMAKE_EXE_LINKER_FLAGS=--coverage \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - name: Build instrumented production and tests
      shell: bash
      run: cmake --build --preset ci-main --parallel 4
    - name: Execute native tests
      shell: bash
      run: ctest --test-dir build --output-on-failure --no-tests=error
    - name: Exercise the actual instrumented polling producer
      shell: bash
      run: python3 .github/scripts/coverage-native.py
    - name: Collect coverage including unexecuted compilation units
      shell: bash
      # Retain diagnostics on test failure without changing its failure status.
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        mkdir -p coverage
        gcovr --root . --filter 'src/' --exclude 'src/third_party/' \
          --sonarqube coverage/sonar.xml --lcov coverage.filtered.info \
          --html-details coverage/index.html --print-summary build
        test -s coverage/sonar.xml
        test -s coverage.filtered.info
        python3 .github/scripts/validate-coverage.py
