version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: spine_test
      MYSQL_DATABASE: cacti_test
      MYSQL_USER: spine_test
      MYSQL_PASSWORD: spine_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uspine_test", "-pspine_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/mysql

  spine-integration:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: spine_test
      DB_PASS: spine_test
      DB_NAME: cacti_test
      DB_PORT: "3306"
